name: nautilus-delta-options

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: nautilus-delta-options:0.1.0
    container_name: nautilus-delta-options-dashboard
    restart: unless-stopped
    init: true

    entrypoint:
      - python
      - -m
      - uvicorn

    command:
      - nautilus_delta_options.web.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - paper_data:/data

    environment:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PAPER_DATABASE: /data/paper-ledger.sqlite
      PAPER_INITIAL_CASH: "${PAPER_INITIAL_CASH:-250}"
      MINIMUM_REWARD_RISK: "${MINIMUM_REWARD_RISK:-1.5}"
      MAX_POSITIONS: "${MAX_POSITIONS:-3}"
      OBSERVER_INTERVAL_SECONDS: "${OBSERVER_INTERVAL_SECONDS:-60}"
      POSITION_EXIT_INTERVAL_SECONDS: "${POSITION_EXIT_INTERVAL_SECONDS:-5}"
      PAPER_ENTRIES_ENABLED: "${PAPER_ENTRIES_ENABLED:-false}"

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    pids_limit: 256
    cpus: 1.0
    mem_limit: 1g
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  paper_data:
